[workspace]
resolver = "3"
members = [
    "crates/collabdoc-core",
    "crates/collabdoc-gpui",
    "crates/collabdoc-ffi",
    "crates/collabdoc-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
loro = "1.17.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Unwind, not abort: the core catches a panic in third-party parsers (the
# Mermaid renderer) and reports the diagram as unreadable instead of taking
# the app down.
panic = "unwind"

# Figure drawing runs once per diagram or SVG and takes milliseconds either
# way: built for size, it keeps the Rust core small.
[profile.release.package.mermaid-rs-renderer]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.tiny-skia]
opt-level = "s"
[profile.release.package.rustybuzz]
opt-level = "s"
[profile.release.package.fontdb]
opt-level = "s"
[profile.release.package.regex-automata]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"
[profile.release.package.json5]
opt-level = "s"

# The launcher is part of every packed file: build it and its (launcher-only)
# dependencies for size.
[profile.release.package.collabdoc-launcher]
opt-level = "s"
[profile.release.package.zstd-sys]
opt-level = "s"
[profile.release.package.zstd-safe]
opt-level = "s"
[profile.release.package.zstd]
opt-level = "s"
[profile.release.package.tar]
opt-level = "s"

# gpui 0.2.2 pulls xattr 0.2.3 (via zed-async-tar), which no longer builds
# against current libc on Linux (ENOATTR is gone; it is ENODATA). One-line
# fix in third_party/xattr; drop this once gpui moves to xattr 1.x.
[patch.crates-io]
xattr = { path = "third_party/xattr" }
