[package]
name = "collabdoc-egui"
description = "Feasibility spike: the CollabDoc editor as an egui widget over the Rust document core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# rlib for Rust hosts; cdylib is the WebAssembly module (`--features web`).
crate-type = ["cdylib", "rlib"]

[features]
# The demo app (an eframe::App around the widget).
demo = ["dep:eframe"]
# The demo in a native window (`--example window`).
native = ["demo", "eframe/x11", "eframe/wayland"]
# The demo in a browser: build for wasm32-unknown-unknown (scripts/egui-web.sh).
web = ["demo", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
collabdoc-core = { path = "../collabdoc-core", default-features = false }
# egui alone: no window, no GPU. A host app adds eframe (wgpu or glow).
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"], optional = true }

[[example]]
name = "window"
required-features = ["native"]
