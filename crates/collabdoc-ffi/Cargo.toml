[package]
name = "collabdoc-ffi"
description = "C ABI over collabdoc-core for non-Rust front ends (the Flutter app)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
collabdoc-core = { path = "../collabdoc-core" }
serde_json = "1"
