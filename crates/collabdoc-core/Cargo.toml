[package]
name = "collabdoc-core"
description = "CollabDoc document model on Loro: block tree, reconcile, undo, .collabdoc files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
loro.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
thiserror = "2"
unicode-segmentation = "1"
